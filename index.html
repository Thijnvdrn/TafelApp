<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thijns tafelapp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-4">
        <h1 class="mb-4">Thijns tafelapp</h1>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title h5">Tafel oefenen</h2>
                        <form onsubmit="maakSom(); return false;">
                            <label for="oefentafel" class="form-label">Welke tafel?</label>
                            <div class="input-group">
                                <input type="number" id="oefentafel" class="form-control" required>
                                <button class="btn btn-success">Nieuwe som</button>
                            </div>
                        </form>

                        <form id="oefenen" class="mt-3" onsubmit="controleer(); return false;" hidden>
                            <label for="antwoord" id="som" class="form-label"></label>
                            <div class="input-group">
                                <input type="number" id="antwoord" class="form-control" required>
                                <button class="btn btn-success">Controleer</button>
                            </div>
                        </form>
                        <p id="melding" class="mb-0" aria-live="polite"></p>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title h5">Tafel opzoeken</h2>
                        <form onsubmit="toonTafel(); return false;">
                            <label for="tafel" class="form-label">Welke tafel?</label>
                            <div class="input-group">
                                <input type="number" id="tafel" class="form-control" required>
                                <button class="btn btn-success">Bekijk</button>
                            </div>
                        </form>
                        <pre id="lijst" class="mt-2 mb-0" aria-live="polite"></pre>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-3 text-secondary">Gemaakt door Thijn</footer>
    </main>
    <script src="tafelapp.js"></script>
</body>
</html>
